[project]
name = "project-nasa-mission-intelligence"
version = "0.1.0"
description = "A RAG based Q&A system that can answer questions about some of NASA's most historic space missions."
readme = "README.md"
requires-python = ">=3.12.7"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "langchain-google-vertexai>=3.2.4",
    "langchain-openai>=1.7.1",
    "openai>=3.3.0",
    "pandas>=3.0.6",
    "ragas>=0.4.3",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
